<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le défi de l'Empereur</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="../../js/auth-guard.js"></script>

    <div id="gameZone">
      <div id="piste">
        <div class="lane" data-lane="0"></div>
        <div class="lane" data-lane="1"></div>
        <div class="lane" data-lane="2"></div>
      </div>

      <div class="banniere" id="banniere-gauche">
        <span>皇</span>
        <span>帝</span>
        <span>挑</span>
        <span>戰</span>
      </div>

      <div class="banniere" id="banniere-droite">
        <span>長</span>
        <span>城</span>
        <span>守</span>
        <span>護</span>
      </div>

      <div id="hud">
        <span id="hud-vies">❤️❤️❤️</span>
        <span id="hud-score">Score : 0</span>
      </div>

      <div id="ecran-menu" class="ecran-overlay actif">
        <h1>Le Défi de l'Empereur</h1>
        <p>Traversez la Grande Muraille sans toucher les obstacles</p>
        <p>← → ou A D pour changer de voie</p>
        <button class="btn-jeu" id="btn-demarrer">Commencer</button>
        <p class="meilleur" id="menu-meilleur-score">Meilleur score : 0</p>
      </div>

      <div id="ecran-game-over" class="ecran-overlay">
        <h1>Game Over</h1>
        <p id="go-score">Score : 0</p>
        <p class="meilleur" id="go-meilleur">Meilleur score : 0</p>
        <button class="btn-jeu" id="btn-rejouer">Rejouer</button>
      </div>
    </div>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
